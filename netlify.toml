# Netlify build config for the Turborepo monorepo. Overrides the stale dashboard
# settings (npm run build / publish dir "dist") left over from the pre-monorepo,
# single-app layout. The web app now builds via turbo and outputs to apps/web/dist.
[build]
  command = "pnpm build:netlify"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The Hono API is pre-bundled by `pnpm bundle:fn` (esbuild) into
# netlify/functions/api.mjs with hono/web-push inlined — pnpm's symlinked layout
# makes Netlify's own bundler leave those external and unresolved. We ship the
# prebuilt file as-is; @libsql/client is external and installed via the
# netlify/functions/package.json.
[functions]
  node_bundler = "none"
