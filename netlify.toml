# Netlify build config for the Turborepo monorepo. Overrides the stale dashboard
# settings (npm run build / publish dir "dist") left over from the pre-monorepo,
# single-app layout. The web app now builds via turbo and outputs to apps/web/dist.
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
